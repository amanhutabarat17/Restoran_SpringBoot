# Konfigurasi Database PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:restoku_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Konfigurasi Hibernate/JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# JWT
app.jwt.secret=${JWT_SECRET:1d02b0bad39fb9b95f96f3c8e943e8e3a0647de35823debab2d1ef78bc1814cc}
app.jwt.expiration-ms=86400000

# Midtrans (Sandbox)
midtrans.server-key=${MIDTRANS_SERVER_KEY}
midtrans.client-key=${MIDTRANS_CLIENT_KEY}
midtrans.is-production=false
midtrans.snap-base-url-sandbox=https://app.sandbox.midtrans.com/snap/v1/transactions
midtrans.snap-base-url-production=https://app.midtrans.com/snap/v1/transactions

# Biaya layanan flat per pesanan
app.biaya-layanan=0

# Upload file (foto menu)
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
